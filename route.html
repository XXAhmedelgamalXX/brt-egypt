<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خريطة مسار BRT المعتمد</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --bg-color: #f3f6f8; --surface: #ffffff; --primary: #f97316; --text-main: #1e293b; --text-light: #64748b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg-color: #0f172a; --surface: #1e293b; --text-main: #f8fafc; --text-light: #94a3b8; --border: #334155; }
        
        body { font-family: 'Cairo', sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 1000; position: relative; border-bottom: 1px solid var(--border); }
        [data-theme="dark"] .header { background: rgba(30, 41, 59, 0.9); }
        
        .header h1 { margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .header h1 i { color: var(--primary); }
        
        .nav-btns { display: flex; gap: 8px; }
        .btn { padding: 8px 12px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 5px; transition: 0.3s; border: 1px solid var(--border); color: var(--text-main); background: var(--surface); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
        
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        
        /* تأثير الوضع الداكن على الخريطة */
        [data-theme="dark"] .leaflet-layer,
        [data-theme="dark"] .leaflet-control-zoom-in,
        [data-theme="dark"] .leaflet-control-zoom-out,
        [data-theme="dark"] .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* تنسيق الـ Popup بتاعة الخريطة */
        .leaflet-popup-content { font-family: 'Cairo', sans-serif; text-align: center; font-size: 14px; margin: 10px !important; }
        .leaflet-popup-content h3 { margin: 0 0 5px 0; color: var(--primary); font-weight: 800; }
        .leaflet-popup-content p { margin: 0; color: #64748b; font-weight: 600; font-size: 12px; }

        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .loading-overlay i { color: var(--primary); font-size: 40px; margin-bottom: 15px; }
        
        /* تظبيط مقاسات الموبايل */
        @media (max-width: 480px) {
            .header { flex-direction: column; gap: 12px; padding: 12px; text-align: center; }
            .nav-btns { width: 100%; justify-content: center; }
            .btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <i class="fa-solid fa-bus fa-bounce"></i>
        <h2 style="margin:0; font-size: 18px;">جاري رسم مسار الدائري...</h2>
    </div>

    <div class="header">
        <h1><i class="fa-solid fa-map-location-dot"></i> المسار المعتمد</h1>
        <div class="nav-btns">
            <a href="index.html" class="btn"><i class="fa-solid fa-plus"></i> إضافة محطة</a>
            <a href="leaderboard.html" class="btn"><i class="fa-solid fa-trophy"></i> الأبطال</a>
        </div>
    </div>

    <div id="map"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);

        const firebaseConfig = {
            apiKey: "AIzaSyAvLh2xaY82KPf532i4ME__at-jFn2xpZU",
            authDomain: "brt-egypt.firebaseapp.com",
            projectId: "brt-egypt",
            storageBucket: "brt-egypt.firebasestorage.app",
            messagingSenderId: "956464108001",
            appId: "1:956464108001:web:f70ba23bccb8070fa702a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map', { zoomControl: false }).setView([30.0444, 31.2357], 11);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const busIcon = L.divIcon({
            html: '<div style="background-color:#f97316; color:white; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.3); font-size:12px;"><i class="fa-solid fa-bus"></i></div>',
            className: 'custom-bus-icon',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -15]
        });

        async function loadVerifiedStations() {
            try {
                const querySnapshot = await getDocs(collection(db, "verified_stations"));
                if (!querySnapshot.empty) {
                    const bounds = [];
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const marker = L.marker([data.lat, data.lng], { icon: busIcon }).addTo(map);
                        marker.bindPopup(`<h3>${data.name}</h3><p><i class="fa-solid fa-user-check"></i> توثيق: ${data.contributor}</p>`);
                        bounds.push([data.lat, data.lng]);
                    });
                    if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
                }
            } catch (error) {
                console.error("Error loading stations:", error);
            } finally {
                const overlay = document.getElementById('loadingOverlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);
            }
        }
        loadVerifiedStations();
    </script>
</body>
</html>
