<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أتوبيس الدائري | BRT Tracker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Intro.js for Tutorial -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/introjs.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/introjs-rtl.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/intro.min.js"></script>
    
    <style>
        :root { --bg-color: #f3f6f8; --surface: #ffffff; --primary: #f97316; --primary-hover: #ea580c; --text-main: #1e293b; --text-light: #64748b; --success: #10b981; --border: #e2e8f0; --input-bg: #f8fafc; }
        [data-theme="dark"] { --bg-color: #0f172a; --surface: #1e293b; --text-main: #f8fafc; --text-light: #94a3b8; --border: #334155; --input-bg: #0f172a; }
        
        body { font-family: 'Cairo', sans-serif; margin: 0; padding: 20px 10px; background-color: transparent !important; color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: color 0.4s ease; }
        
        /* خلفية الفيديو */
        .bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; pointer-events: none; }
        .video-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.65); z-index: -1; pointer-events: none; }

        .top-controls { width: 100%; max-width: 500px; display: flex; justify-content: space-between; margin-bottom: 15px; }
        .controls-group { display: flex; gap: 10px; }
        
        .control-btn { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); color: var(--text-main); border: 1px solid var(--border); padding: 8px 15px; border-radius: 12px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        [data-theme="dark"] .control-btn { background: rgba(30, 41, 59, 0.85); }
        .control-btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn-help { color: var(--primary); border-color: var(--primary); }

        .app-container { background: rgba(255, 255, 255, 0.85) !important; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); width: 100%; max-width: 500px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); overflow: hidden; animation: fadeIn 0.8s ease-out; border: 1px solid rgba(255, 255, 255, 0.3); }
        [data-theme="dark"] .app-container { background: rgba(30, 41, 59, 0.85) !important; border-color: rgba(255, 255, 255, 0.1); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { padding: 25px 20px 15px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header h1 i { color: var(--primary); }
        .header p { margin: 5px 0 0; font-size: 14px; color: var(--text-light); }
        
        .map-wrapper { padding: 0 20px; position: relative; }
        #map { height: 280px; width: 100%; border-radius: 16px; z-index: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid var(--border); cursor: crosshair; }
        [data-theme="dark"] .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        .center-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); z-index: 1000; pointer-events: none; transition: transform 0.1s; }
        .center-marker i { font-size: 38px; color: #ef4444; filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.4)); }

        .form-section { padding: 20px; }
        .manual-coords { background: rgba(249, 115, 22, 0.05); border: 1px dashed var(--primary); padding: 12px; border-radius: 12px; margin-bottom: 20px; }
        .coords-note { font-size: 12px; color: var(--text-light); margin: 0 0 10px 0; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .coords-note i { color: var(--primary); }
        
        .smart-paste-input { width: 100%; padding: 12px; font-size: 13px; text-align: left; direction: ltr; border: 2px solid var(--border); border-radius: 10px; background: var(--input-bg); color: var(--text-main); font-weight: 700; font-family: monospace; transition: border-color 0.3s; box-sizing: border-box; }
        .smart-paste-input:focus { outline: none; border-color: var(--primary); }

        .input-group { margin-bottom: 15px; position: relative; }
        .input-group i { position: absolute; inset-inline-end: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; transition: color 0.3s; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding-block: 14px; padding-inline-start: 15px; padding-inline-end: 40px; border: 2px solid var(--border); border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 600; background: var(--input-bg); color: var(--text-main); transition: all 0.3s ease; }
        input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1); }
        
        button.action-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.25); }
        button.action-btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
        button.action-btn:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; box-shadow: none; transform: none; }
        
        .security-note { margin-top: 15px; padding: 10px; border-radius: 10px; background: rgba(16, 185, 129, 0.05); border: 1px dashed var(--success); font-size: 12px; font-weight: 600; color: var(--text-light); display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
        .security-note i { color: var(--success); font-size: 14px; }
        
        .footer { margin-top: auto; padding: 30px 20px 10px; text-align: center; width: 100%; max-width: 500px; animation: fadeIn 1s ease-out; }
        .dev-badge { display: inline-block; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); border: 1px solid var(--border); color: var(--text-main); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; margin-bottom: 8px; }
        [data-theme="dark"] .dev-badge { background: rgba(30, 41, 59, 0.85); color: white; }
        .dev-name { font-size: 16px; font-weight: 800; margin-bottom: 2px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .dev-title { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        
        .social-links { display: flex; justify-content: center; gap: 12px; margin-top: 15px; }
        .social-btn { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-main); background: rgba(255, 255, 255, 0.85); border: 1px solid var(--border); font-size: 18px; text-decoration: none; transition: all 0.3s ease; }
        [data-theme="dark"] .social-btn { background: rgba(30, 41, 59, 0.85); color: white; }
        
        /* --- تظبيط مقاسات الموبايلات الصغيرة جداً --- */
        @media (max-width: 480px) {
            body { padding: 10px 5px; }
            .header { padding: 20px 15px 10px; }
            .header h1 { font-size: 20px; }
            #map { height: 230px; } /* تصغير الخريطة عشان الفورم يظهر كله */
            .form-section { padding: 15px; }
            button.action-btn { padding: 14px; font-size: 15px; }
            .smart-paste-input, input[type="text"] { font-size: 13px; padding-block: 12px; }
        }

        /* تحسينات Intro.js */
        .introjs-tooltip { font-family: 'Cairo', sans-serif !important; border-radius: 20px !important; box-shadow: 0 10px 40px rgba(0,0,0,0.15) !important; max-width: 90vw !important; width: 320px !important; border: none !important; background-color: var(--surface) !important; color: var(--text-main) !important; }
        .introjs-button { font-family: 'Cairo', sans-serif !important; font-weight: 700 !important; border-radius: 10px !important; text-shadow: none !important; padding: 8px 12px !important; border: 1px solid var(--border) !important; background: var(--bg-color) !important; color: var(--text-main) !important; transition: all 0.3s ease !important; }
        .introjs-nextbutton { background: var(--primary) !important; color: white !important; border-color: var(--primary) !important; }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="bg-video">
        <source src="brt-background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="top-controls">
        <button class="control-btn btn-help" onclick="startTutorial()"><i class="fa-solid fa-circle-question"></i> <span id="helpText">جولة تعليمية</span></button>
        <div class="controls-group">
            <button id="themeToggleBtn" class="control-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
            <button id="langToggleBtn" class="control-btn" onclick="toggleLang()">EN</button>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <h1><i class="fa-solid fa-route"></i> <span id="appTitle">مسار الـ BRT</span></h1>
            <p id="appDesc">شارك في رسم وتوثيق محطات الطريق الدائري</p>
        </div>

        <div class="map-wrapper" id="tour-map">
            <div id="map"></div>
            <div class="center-marker" id="centerMarker"><i class="fa-solid fa-location-dot"></i></div>
        </div>

        <div class="form-section">
            
            <div class="manual-coords" id="tour-coords">
                <p class="coords-note" id="coordsNote"><i class="fa-solid fa-lightbulb"></i> اسحب الخريطة لضبط الدبوس، أو الصق الإحداثيات معاً.</p>
                <input type="text" id="pastedCoords" class="smart-paste-input" oninput="parseCoordinates(this.value)">
            </div>

            <div class="input-group" id="tour-name">
                <input type="text" id="stationName">
                <i class="fa-solid fa-location-dot"></i>
            </div>

            <div class="input-group" id="tour-user">
                <input type="text" id="contributorName">
                <i class="fa-solid fa-user"></i>
            </div>

            <button id="submitBtn" class="action-btn" onclick="sendData()" data-step-id="tour-submit">
                <i class="fa-solid fa-cloud-arrow-up"></i> <span id="btnText">حفظ بيانات المحطة</span>
            </button>

            <div class="security-note">
                <i class="fa-solid fa-shield-halved"></i>
                <span id="securityText">ملاحظة أمنية: تأكد من دقة الإحداثيات قبل الإرسال.</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="dev-badge" id="devBadge">تم التطوير بواسطة</div>
        
        <div class="dev-name" id="secretDoor" style="cursor: pointer; user-select: none;">Ahmed Al-Gamal</div>
        <div class="dev-title" id="devTitle">طالب علوم حاسب وأمن سيبراني</div>
        
        <div class="social-links">
            <a href="route.html" class="social-btn" title="خريطة المسار المعتمد"><i class="fa-solid fa-map-location-dot" style="color: var(--primary);"></i></a>
            <a href="leaderboard.html" class="social-btn" title="لوحة الشرف"><i class="fa-solid fa-trophy" style="color: var(--gold);"></i></a>
            <a href="https://github.com/XXAhmedelgamalXX" target="_blank" class="social-btn"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.linkedin.com/in/ahmed-algamal-4995993b4/" target="_blank" class="social-btn"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <div class="copyright-text" id="copyrightText"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvLh2xaY82KPf532i4ME__at-jFn2xpZU",
            authDomain: "brt-egypt.firebaseapp.com",
            projectId: "brt-egypt",
            storageBucket: "brt-egypt.firebasestorage.app",
            messagingSenderId: "956464108001",
            appId: "1:956464108001:web:f70ba23bccb8070fa702a0",
            measurementId: "G-7X07B0Q6HE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentYear = new Date().getFullYear();

        const dict = {
            ar: { title: "مسار الـ BRT", desc: "شارك في رسم وتوثيق محطات الطريق الدائري", coordsNote: "اسحب الخريطة لضبط الدبوس، أو الصق الإحداثيات.", coordsPh: "الصق اللوكيشن هنا (مثال: 30.044, 31.235)", stationPh: "اسم المحطة (مثال: تقاطع السويس)", namePh: "اسمك لـ لوحة الشرف (اختياري)", btnText: "حفظ بيانات المحطة", securityMsg: "ملاحظة أمنية: تأكد من دقة الإحداثيات قبل الإرسال.", devBadge: "تم التطوير بواسطة", devTitle: "طالب علوم حاسب وأمن سيبراني", copyrightText: `جميع الحقوق محفوظة © ${currentYear}`, errInput: "يرجى إدخال اسم المحطة أولاً.", saving: "جاري الحفظ...", saved: "تم الحفظ بنجاح", errServer: "حدث خطأ أثناء الحفظ", helpText: "مساعدة" },
            en: { title: "BRT Tracker", desc: "Help map the new Ring Road BRT stations", coordsNote: "Drag the map or paste coordinates directly.", coordsPh: "Paste location here (e.g., 30.04, 31.23)", stationPh: "Station Name (e.g., Suez Road)", namePh: "Leaderboard Name (Optional)", btnText: "Save Station Data", securityMsg: "Note: Ensure the pin is accurately placed before saving.", devBadge: "DEVELOPED BY", devTitle: "CS & Cybersecurity Student", copyrightText: `All Rights Reserved © ${currentYear}`, errInput: "Please enter the station name.", saving: "Saving Data...", saved: "Saved Successfully", errServer: "Error occurred while saving", helpText: "Tutorial" }
        };

        let currentLang = localStorage.getItem('lang') || 'ar';
        let currentTheme = localStorage.getItem('theme') || 'light';

        window.toggleTheme = function() { currentTheme = currentTheme === 'light' ? 'dark' : 'light'; localStorage.setItem('theme', currentTheme); applySettings(); };
        window.toggleLang = function() { currentLang = currentLang === 'ar' ? 'en' : 'ar'; localStorage.setItem('lang', currentLang); applySettings(); };

        function applySettings() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('themeToggleBtn').innerHTML = currentTheme === 'dark' ? '<i class="fa-solid fa-sun" style="color: #fbbf24;"></i>' : '<i class="fa-solid fa-moon"></i>';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            document.getElementById('langToggleBtn').innerText = currentLang === 'ar' ? 'EN' : 'عربي';
            document.getElementById('helpText').innerText = dict[currentLang].helpText;
            document.getElementById('appTitle').innerText = dict[currentLang].title;
            document.getElementById('appDesc').innerText = dict[currentLang].desc;
            document.getElementById('coordsNote').innerHTML = `<i class="fa-solid fa-lightbulb"></i> ${dict[currentLang].coordsNote}`;
            document.getElementById('pastedCoords').placeholder = dict[currentLang].coordsPh;
            document.getElementById('stationName').placeholder = dict[currentLang].stationPh;
            document.getElementById('contributorName').placeholder = dict[currentLang].namePh;
            document.getElementById('btnText').innerText = dict[currentLang].btnText;
            document.getElementById('securityText').innerText = dict[currentLang].securityMsg;
            document.getElementById('devBadge').innerText = dict[currentLang].devBadge;
            document.getElementById('devTitle').innerText = dict[currentLang].devTitle;
            document.getElementById('copyrightText').innerText = dict[currentLang].copyrightText;
        }
        applySettings();

        let myDeviceId = localStorage.getItem('brt_device_id');
        if (!myDeviceId) { myDeviceId = 'user_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('brt_device_id', myDeviceId); }
        let savedName = localStorage.getItem('brt_user_name');
        if (savedName) document.getElementById('contributorName').value = savedName;

        let userLat = 30.0444, userLng = 31.2357; 
        let map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSMap' }).addTo(map);

        map.on('move', function () {
            const center = map.getCenter();
            userLat = center.lat;
            userLng = center.lng;
            document.getElementById('pastedCoords').value = `${userLat.toFixed(6)}, ${userLng.toFixed(6)}`;
            document.getElementById('centerMarker').style.transform = 'translate(-50%, -110%)';
        });

        map.on('moveend', function () { document.getElementById('centerMarker').style.transform = 'translate(-50%, -100%)'; });

        window.parseCoordinates = function(val) {
            const matches = val.match(/-?\d+\.\d+/g);
            if (matches && matches.length >= 2) {
                const parsedLat = parseFloat(matches[0]);
                const parsedLng = parseFloat(matches[1]);
                
                if(parsedLat >= -90 && parsedLat <= 90 && parsedLng >= -180 && parsedLng <= 180) {
                    userLat = parsedLat;
                    userLng = parsedLng;
                    map.flyTo([userLat, userLng], 16, { animate: true, duration: 1.5 });
                    document.getElementById('pastedCoords').style.borderColor = 'var(--success)';
                }
            } else {
                document.getElementById('pastedCoords').style.borderColor = 'var(--border)';
            }
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                map.flyTo([position.coords.latitude, position.coords.longitude], 15, { animate: true, duration: 2 });
            }, () => {});
        }

        window.startTutorial = function() {
            introJs().setOptions({
                nextLabel: currentLang === 'ar' ? 'التالي' : 'Next', prevLabel: currentLang === 'ar' ? 'السابق' : 'Back', 
                doneLabel: currentLang === 'ar' ? 'فهمت، يلا نبدأ' : 'Got it!', skipLabel: currentLang === 'ar' ? 'تخطي' : 'Skip',
                showStepNumbers: true, rtl: currentLang === 'ar',
                steps: [
                    { intro: currentLang === 'ar' ? "👋 <b>أهلاً بك!</b><br>في ثواني هنشرحلك إزاي تضيف محطة الدائري." : "👋 <b>Welcome!</b><br>Let's quickly show you how to add a BRT station." },
                    { element: document.querySelector('#tour-map'), intro: currentLang === 'ar' ? "📍 <b>حرك الخريطة:</b> اسحب الخريطة لحد ما الدبوس الأحمر يقف فوق المحطة بالظبط." : "📍 <b>Move the Map:</b> Drag the map until the red pin points exactly at the station." },
                    { element: document.querySelector('#tour-coords'), intro: currentLang === 'ar' ? "🌐 <b>لصق الإحداثيات:</b> لو معاك اللوكيشن من جوجل ماب، انسخه والزقه هنا والخريطة هتروحله فوراً." : "🌐 <b>Smart Paste:</b> Have a Google Maps link or coordinates? Paste them here, and the map will auto-adjust!" },
                    { element: document.querySelector('#tour-name'), intro: currentLang === 'ar' ? "✍️ <b>اسم المحطة:</b> اكتب اسم المحطة هنا (مثال: محطة عدلي منصور)." : "✍️ <b>Station Name:</b> Enter the station's name here (e.g., Adly Mansour)." },
                    { element: document.querySelector('#tour-user'), intro: currentLang === 'ar' ? "🏆 <b>اسمك للوحة الشرف:</b> اكتب اسمك عشان يظهر في قائمة أفضل المساهمين." : "🏆 <b>Leaderboard Name:</b> Add your name to collect points on the contributor leaderboard." },
                    { element: document.querySelector('#submitBtn'), intro: currentLang === 'ar' ? "☁️ <b>رفع البيانات:</b> اضغط هنا عشان تحفظ المحطة والإدارة تراجعها." : "☁️ <b>Submit:</b> Click here to save the station for admin review." }
                ]
            }).start();
        };

        if (!localStorage.getItem('brt_tour_done')) { setTimeout(() => { startTutorial(); localStorage.setItem('brt_tour_done', 'true'); }, 1000); }

        window.sendData = async function() {
            const stationName = document.getElementById('stationName').value.trim();
            const contributorName = document.getElementById('contributorName').value.trim() || "مساهم مجهول";

            if (!stationName) { alert(dict[currentLang].errInput); document.getElementById('stationName').focus(); return; }

            if (contributorName !== "مساهم مجهول") { localStorage.setItem('brt_user_name', contributorName); }

            const btn = document.getElementById('submitBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class='fa-solid fa-circle-notch fa-spin'></i> <span>${dict[currentLang].saving}</span>`;
            btn.disabled = true;

            try {
                await addDoc(collection(db, "pending_stations"), {
                    name: stationName, contributor: contributorName, deviceId: myDeviceId, 
                    lat: userLat, lng: userLng, status: "pending", timestamp: serverTimestamp()
                });
                
                btn.style.background = "var(--success)";
                btn.innerHTML = `<i class='fa-solid fa-check'></i> <span>${dict[currentLang].saved}</span>`;
                document.getElementById('stationName').value = "";
                
                setTimeout(() => { btn.style.background = "var(--primary)"; btn.innerHTML = originalHTML; btn.disabled = false; }, 2500);
            } catch (e) {
                btn.style.background = "#ef4444";
                btn.innerHTML = `<i class='fa-solid fa-xmark'></i> <span>${dict[currentLang].errServer}</span>`;
                setTimeout(() => { btn.style.background = "var(--primary)"; btn.innerHTML = originalHTML; btn.disabled = false; }, 2500);
            }
        };

        let clickCount = 0; let clickTimer;
        document.getElementById('secretDoor').addEventListener('click', function() {
            clickCount++; clearTimeout(clickTimer);
            if (clickCount === 5) { window.location.href = 'admin.html'; }
            clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
        });
    </script>
</body>
</html>
